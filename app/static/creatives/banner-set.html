<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秋の味覚フェア ディスプレイバナーセット（デモ・架空）</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Yu Gothic UI","Meiryo",sans-serif;background:radial-gradient(900px 500px at 20% 0,#3a2a20,#17110d);color:#fff;min-height:100vh;padding:28px;display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start;justify-content:center}
h1{width:100%;font-size:15px;letter-spacing:.2em;font-weight:600;opacity:.8;text-align:center}
.item{display:grid;gap:10px;justify-items:center}
.item small{opacity:.65;font-size:12px}
.rp{border:1px solid #fff4;background:#fff1;color:#fff;border-radius:99px;padding:4px 14px;cursor:pointer;font-size:12px}
.bn{--w:300px;--h:250px;position:relative;width:var(--w);height:var(--h);overflow:hidden;border-radius:4px;background:linear-gradient(135deg,#ff9a3c,#d9461f 60%,#7a1f12);box-shadow:0 18px 40px #0008;cursor:pointer}
.bn:hover .cta{transform:scale(1.08)}
.bn::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,#ffffff22,transparent 20%,#ffffff22 40%,transparent 60%,#ffffff22 80%,transparent);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.leaf{position:absolute;top:-30px;width:22px;height:30px;background:linear-gradient(135deg,#ffd166,#e07a1f);border-radius:0 100% 0 100%;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(calc(var(--h) + 60px)) rotate(540deg) translateX(40px)}}
.pers{position:absolute;filter:drop-shadow(0 8px 10px #0006);animation:pop 12s cubic-bezier(.2,1.4,.3,1) infinite}
@keyframes pop{0%,2%{transform:scale(0) rotate(-40deg)}8%,88%{transform:scale(1) rotate(0)}95%,100%{transform:scale(0)}}
.t{position:absolute;font-weight:800;text-shadow:0 2px 12px #0007;opacity:0;line-height:1.15}
.t1{animation:in1 12s infinite}.t2{animation:in2 12s infinite}.t3{animation:in3 12s infinite}.cta{animation:in3 12s infinite,pulse 1.6s ease-in-out infinite}
@keyframes in1{0%,3%{opacity:0;transform:translateX(-30px)}9%,38%{opacity:1;transform:none}44%,100%{opacity:0;transform:translateX(30px)}}
@keyframes in2{0%,40%{opacity:0;transform:translateY(20px)}47%,70%{opacity:1;transform:none}76%,100%{opacity:0;transform:translateY(-20px)}}
@keyframes in3{0%,72%{opacity:0;transform:scale(.8)}80%,94%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 8px #fff3}}
.cta{position:absolute;padding:8px 18px;border-radius:99px;background:#fff;color:#a8300f;font-weight:800;font-size:14px;transition:transform .2s;opacity:0}
/* 300x250 */
.b1 .pers{right:14px;bottom:14px;width:110px}.b1 .t1{left:16px;top:22px;font-size:30px;width:170px}.b1 .t2{left:16px;top:112px;font-size:20px;width:160px}.b1 .t3{left:16px;top:112px;font-size:15px;width:170px}.b1 .cta{left:16px;bottom:22px}
/* 728x90 */
.b2{--w:728px;--h:90px}.b2 .pers{left:12px;top:6px;width:78px}.b2 .t1{left:110px;top:24px;font-size:28px;white-space:nowrap}.b2 .t2{left:110px;top:28px;font-size:22px;white-space:nowrap}.b2 .t3{left:110px;top:30px;font-size:17px;white-space:nowrap}.b2 .cta{right:20px;top:28px}
/* 160x600 */
.b3{--w:160px;--h:600px;background:linear-gradient(180deg,#ff9a3c,#c0401c 55%,#5d160c)}.b3 .pers{left:20px;top:300px;width:120px}.b3 .t1{left:16px;top:40px;font-size:34px;width:130px}.b3 .t2{left:16px;top:170px;font-size:20px;width:130px}.b3 .t3{left:16px;top:170px;font-size:15px;width:130px}.b3 .cta{left:20px;bottom:36px}
@media(prefers-reduced-motion:reduce){.bn *,.bn::before{animation:none!important}.t,.cta{opacity:1!important}.t2,.t3{display:none}}
</style>
</head>
<body>
<h1>秋の味覚フェア · ディスプレイバナー 3サイズ（デモ・架空）</h1>
<div class="item"><div class="bn b1" data-size="300x250"></div><small>300 × 250 ミディアムレクタングル</small><button class="rp">↻ リプレイ</button></div>
<div class="item"><div class="bn b2" data-size="728x90"></div><small>728 × 90 リーダーボード</small><button class="rp">↻ リプレイ</button></div>
<div class="item"><div class="bn b3" data-size="160x600"></div><small>160 × 600 ワイドスカイスクレイパー</small><button class="rp">↻ リプレイ</button></div>
<script>
const svg='<svg viewBox="0 0 100 100"><defs><radialGradient id="pg" cx=".35" cy=".3"><stop offset="0" stop-color="#ffc46b"/><stop offset=".6" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d9461f"/></radialGradient></defs><ellipse cx="50" cy="58" rx="40" ry="36" fill="url(#pg)"/><path d="M50 24c-14 0-26 6-30 14 10-3 20-3 30 2 10-5 20-5 30-2-4-8-16-14-30-14z" fill="#3c8f3a"/><rect x="47" y="12" width="6" height="14" rx="3" fill="#5b3a1d"/></svg>';
document.querySelectorAll(".bn").forEach(b=>{
  const h=parseInt(getComputedStyle(b).getPropertyValue("--h"));
  const w=parseInt(getComputedStyle(b).getPropertyValue("--w"));
  const n=Math.round(w/45)+4;
  for(let i=0;i<n;i++){const l=document.createElement("i");l.className="leaf";l.style.left=(i*(w/n)+Math.sin(i*7)*8)+"px";l.style.animationDuration=(4+(i%5)*1.3)+"s";l.style.animationDelay=(-(i%7)*1.1)+"s";l.style.transform=`rotate(${i*40}deg)`;b.append(l)}
  b.insertAdjacentHTML("beforeend",'<div class="pers">'+svg+'</div><div class="t t1">秋の味覚<br>フェア</div><div class="t t2">旬の味が、<br>ぜんぶ集合。</div><div class="t t3">11/1(土)〜11/30(日)</div><div class="cta">詳しく見る ▶</div>');
  if(b.classList.contains("b2")){b.querySelector(".t1").innerHTML="秋の味覚フェア";b.querySelector(".t2").innerHTML="旬の味が、ぜんぶ集合。"}
  b.addEventListener("click",()=>b.animate([{outline:"3px solid #fff"},{outline:"0 solid transparent"}],{duration:400}));
});
document.querySelectorAll(".rp").forEach(btn=>btn.onclick=()=>{const b=btn.parentElement.querySelector(".bn");b.querySelectorAll(".t,.pers,.cta").forEach(e=>{e.style.animation="none";void e.offsetWidth;e.style.animation=""})});
</script>
<script>if(/[?&]thumb/.test(location.search)){setTimeout(function(){var s=document.createElement("style");s.textContent="*{animation-play-state:paused!important;transition:none!important}";document.head.append(s);window.requestAnimationFrame=function(){return 0}},2200)}</script>
</body>
</html>
